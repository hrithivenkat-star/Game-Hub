<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Dungeon Crawler — The Underground</title><style>
:root{--a:#e8a341;--b:#a3221a;--d:#8a7a68}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(ellipse at 50% 20%,#241a10,#0a0705 70%);color:#e8dcc8;font-family:'Courier New',monospace;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px;user-select:none}
.back{align-self:flex-start;color:var(--d);text-decoration:none;font-size:13px}.back:hover{color:var(--a)}
h1{color:var(--b);font-size:clamp(18px,5vw,26px);letter-spacing:3px;text-shadow:0 0 18px rgba(163,34,26,.6)}
#hud{color:var(--a);font-size:15px;letter-spacing:1px;text-align:center;min-height:22px}
.wrap{position:relative;width:min(96vw,640px)}
canvas{width:100%;display:block;border:3px solid #5a3a1c;border-radius:10px;background:#000;touch-action:none}
.ov{position:absolute;inset:0;background:rgba(8,5,3,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;border-radius:8px;padding:16px;z-index:5}.ov.hide{display:none}
.ov h2{color:var(--b);font-size:28px;text-shadow:0 0 20px rgba(163,34,26,.6)}.ov p{color:#d8cbb5;font-size:14px;line-height:1.5}
button{background:rgba(232,163,65,.14);border:1px solid var(--a);color:var(--a);padding:12px 22px;border-radius:8px;font:inherit;cursor:pointer}button:hover{background:rgba(232,163,65,.26)}
.tip{color:var(--d);font-size:12px;text-align:center;max-width:520px}
</style></head><body>
<a class="back" href="../../index.html">← The Underground</a><h1>DUNGEON CRAWLER</h1><div id="hud"></div>
<div class="wrap"><canvas id="c" width="600" height="440"></canvas><div id="ov" class="ov"><h2 id="oh">DUNGEON CRAWLER</h2><p id="ovp">Arrows / WASD or swipe. Bump enemies to fight. 🧪 heals, ▼ goes deeper. You only get one life.</p><button id="rb">Descend</button></div></div><p class="tip">Permadeath. Every floor adds more monsters and tougher ones.</p>
<script>
const $=id=>document.getElementById(id);
const W=15,H=11,T=40,cv=$('c'),g=cv.getContext('2d');
let m,seen,p,en,pots,st,fl,hp,dead=true,msg='',best=+localStorage.ug_dc||0;
function gen(){
  m=[...Array(H)].map(()=>Array(W).fill(1));seen=[...Array(H)].map(()=>Array(W).fill(0));
  let a=7,b=5;
  for(let i=0;i<120;i++){m[b][a]=0;const d=[[1,0],[-1,0],[0,1],[0,-1]][Math.random()*4|0];a=Math.max(1,Math.min(W-2,a+d[0]));b=Math.max(1,Math.min(H-2,b+d[1]))}
  const f=[];for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++)if(!m[y][x])f.push({x,y});
  f.sort(()=>Math.random()-.5);p=f.shift();
  f.sort((u,v)=>(Math.abs(v.x-p.x)+Math.abs(v.y-p.y))-(Math.abs(u.x-p.x)+Math.abs(u.y-p.y)));
  st=f.shift();f.sort(()=>Math.random()-.5);pots=f.splice(0,2);
  en=f.filter(t=>Math.abs(t.x-p.x)+Math.abs(t.y-p.y)>3).slice(0,Math.min(2+fl,9)).map(t=>({x:t.x,y:t.y,h:2+(fl/3|0)}));
}
function start(){fl=1;hp=10;dead=false;msg='Find the stairs ▼';gen();$('ov').classList.add('hide');draw()}
const vis=(x,y)=>(x-p.x)**2+(y-p.y)**2<=26,at=(a,x,y)=>a.find(o=>o.x===x&&o.y===y);
function step(dx,dy){
  if(dead)return;const nx=p.x+dx,ny=p.y+dy;if(m[ny][nx])return;
  const e=at(en,nx,ny);
  if(e){const d=1+(Math.random()*3|0);e.h-=d;msg=e.h<=0?'Slain! (-'+d+')':'You hit for '+d;if(e.h<=0)en.splice(en.indexOf(e),1)}
  else{p.x=nx;p.y=ny;msg='';
    const q=at(pots,nx,ny);if(q){pots.splice(pots.indexOf(q),1);hp=Math.min(10,hp+4);msg='+4 HP'}
    if(nx===st.x&&ny===st.y){fl++;hp=Math.min(10,hp+2);gen();msg='Floor '+fl+'. It gets worse.';draw();return}}
  en.forEach(e=>{
    const ax=p.x-e.x,ay=p.y-e.y,d=Math.abs(ax)+Math.abs(ay);
    if(d===1){const dm=1+(Math.random()<.4?1:0);hp-=dm;msg+=' Hit -'+dm}
    else if(d<8){const sx=Math.sign(ax),sy=Math.sign(ay),tr=Math.abs(ax)>Math.abs(ay)?[[sx,0],[0,sy]]:[[0,sy],[sx,0]];
      for(const[a,b]of tr){if(!(a||b))continue;const X=e.x+a,Y=e.y+b;if(!m[Y][X]&&!at(en,X,Y)&&!(X===p.x&&Y===p.y)){e.x=X;e.y=Y;break}}}
  });
  if(hp<=0){dead=true;if(fl>best){best=fl;localStorage.ug_dc=best}$('oh').textContent='YOU DIED';$('ovp').textContent='You reached floor '+fl+'. Best: '+best+'. No respawns.';$('rb').textContent='Descend again';$('ov').classList.remove('hide')}
  draw();
}
function draw(){
  g.fillStyle='#000';g.fillRect(0,0,600,440);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const v=vis(x,y);if(v)seen[y][x]=1;if(!seen[y][x])continue;
    g.fillStyle=m[y][x]?(v?'#4a3524':'#241a12'):(v?'#33261a':'#171009');g.fillRect(x*T,y*T,T-1,T-1)}
  g.font='28px serif';g.textAlign='center';g.textBaseline='middle';
  const E=(o,s)=>{if(vis(o.x,o.y))g.fillText(s,o.x*T+T/2,o.y*T+T/2+2)};
  if(seen[st.y][st.x]){g.fillStyle=vis(st.x,st.y)?'#e8a341':'#6b4d1f';g.fillText('▼',st.x*T+T/2,st.y*T+T/2)}
  pots.forEach(o=>E(o,'🧪'));en.forEach(o=>E(o,'👹'));g.fillText('🧙',p.x*T+T/2,p.y*T+T/2+2);
  $('hud').textContent='❤ '+Math.max(0,hp)+'/10   Floor '+fl+'   Best '+best+'   '+msg;
}
const K={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]};
addEventListener('keydown',e=>{const k=K[e.key.length===1?e.key.toLowerCase():e.key];if(k){e.preventDefault();step(...k)}});
let t0;cv.addEventListener('touchstart',e=>t0=e.touches[0]);
cv.addEventListener('touchend',e=>{const t=e.changedTouches[0],dx=t.clientX-t0.clientX,dy=t.clientY-t0.clientY;if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;Math.abs(dx)>Math.abs(dy)?step(Math.sign(dx),0):step(0,Math.sign(dy))});
$('rb').onclick=start;

</script></body></html>
